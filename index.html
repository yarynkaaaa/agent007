    <title>Рекомендатор фільмів, мультфільмів і книжок</title>
    <style>
      :root {
        --bg: #f4f5fb;
        --surface: #fff;
        --text: #20243a;
        --muted: #737991;
        --border: #e1e4ef;
        --accent: #6558df;
        --user: #6558df;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101326;
          --surface: #1b2038;
          --text: #f1f2ff;
          --muted: #a3a9c5;
          --border: #343953;
          --accent: #958aff;
          --user: #6558df;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, Arial, sans-serif;
      }
      header {
        background: var(--surface);
        padding: 17px;
        text-align: center;
        font-weight: 800;
        border-bottom: 1px solid var(--border);
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 18px 12px;
      }
      .col {
        max-width: 760px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 92%;
        padding: 12px 15px;
        border-radius: 16px;
        overflow-wrap: anywhere;
      }
      .agent {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .user {
        align-self: flex-end;
        background: var(--user);
        color: white;
      }
      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 13px;
        margin-top: 10px;
      }
      .card h3 {
        margin: 5px 0;
        font-size: 17px;
      }
      .card p {
        margin: 5px 0;
        font-size: 14px;
      }
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        background: #e7e4ff;
        color: #5143c3;
      }
      .genre {
        color: var(--muted);
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 12px;
      }
      .choice {
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        padding: 9px 13px;
        cursor: pointer;
        font-size: 14px;
      }
      .choice:hover {
        border-color: var(--accent);
      }
      form {
        padding: 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .row {
        max-width: 760px;
        margin: auto;
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
      }
      button.send {
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        padding: 0 18px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>

      let ctx = { kind: null, tag: null, shown: [] };

      function message(role, text, items = []) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        const p = document.createElement("p");
        p.textContent = text;
        el.appendChild(p);

        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "card";

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = item.kind;

          const title = document.createElement("h3");
          title.textContent = item.title;

          const genre = document.createElement("p");
          genre.className = "genre";
          genre.textContent = "Жанр: " + item.genre;

          const plot = document.createElement("p");
          plot.textContent = item.plot;

          card.append(badge, title, genre, plot);
          el.appendChild(card);
          ctx.shown.push(item.title);
        });

        col.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function buttons(items) {
        const el = document.createElement("div");
        el.className = "choices";
        items.forEach(([label, value]) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "choice";
          b.textContent = label;
          b.onclick = () => send(value);
          el.appendChild(b);
        });
        col.lastElementChild.appendChild(el);
      }

        );
        buttons([
          ["🎬 Фільм", "фільм"],
          ["📺 Серіал", "серіал"],
          ["🎨 Мультфільм", "мультфільм"],
          ["🇯🇵 Аніме", "аніме"],
          ["📚 Книжка", "книжка"],
          ["🎲 Будь-що", "будь-що"],
        ]);
      }

      function detectTag(t) {
        if (/сміх|сміш|весел|комед|поржати/.test(t)) return "сміх";
        if (/романт|кохан|любов|закох/.test(t)) return "романтика";
        if (/сум|груст|драма|поплакат/.test(t)) return "драма";
        if (/пригод|екшн|бойов|динамік/.test(t)) return "пригоди";
        if (/спок|затиш|доб|відпоч|розслаб/.test(t)) return "затишок";
        if (/страш|напруг|трилер|жах/.test(t)) return "напруга";
        if (/детектив|таємниц|загад|розгад/.test(t)) return "загадка";
        return null;
      }

      function detectKind(t) {
        if (/будь-як|будь що|будь-що|неважливо|все одно/.test(t)) return "all";
        if (/мульт|анімац|мультик/.test(t)) return "мультфільм";
        if (/аніме/.test(t)) return "аніме";
        if (/серіал|сезон|серії/.test(t)) return "серіал";
        if (/книж|книг|почит|читат/.test(t)) return "книжка";
        if (/фільм|кіно|подивит/.test(t)) return "фільм";
        return null;
      }

      function recommend() {
        let pool = CATALOG.filter(
          (x) =>
            !ctx.shown.includes(x.title) &&
            (!ctx.kind || ctx.kind === "all" || x.kind === ctx.kind),
        );

        if (ctx.tag) {
          pool.sort(
            (a, b) => Number(b.tag === ctx.tag) - Number(a.tag === ctx.tag),
          );
        }

        const results = pool.slice(0, 4);
        if (!results.length) {
          message(
            "agent",
            "На жаль, нові варіанти закінчилися 😅 Спробуй іншу категорію або почни спочатку.",
          );
          return;
        }

        message("agent", "✨ Ось що я підібрав для тебе:", results);
        message("agent", "Хочеш ще рекомендацій чи оберемо щось інше?");
        buttons([
          ["🔄 Ще варіанти", "ще"],
          ["🎭 Інший жанр", "інший жанр"],
          ["🏠 Спочатку", "спочатку"],
        ]);
      }

      function respond(text) {
        const t = text.toLowerCase().trim();

        if (/спочатку|заново|скинути|почати спочатку/.test(t)) {
          start();
          return;
        }

        if (/ще|більше|інші варіанти|далі/.test(t)) {
          recommend();
          return;
        }

        const kind = detectKind(t);
        const tag = detectTag(t);

        if (kind) {
          ctx.kind = kind;
          if (!tag && !ctx.tag) {
            message(
              "agent",
              "Чудово! А який жанр або настрій тобі подобається?",
            );
            buttons([
              ["😂 Комедія", "сміх"],
              ["❤️ Романтика", "романтика"],
              ["⚔️ Пригоди", "пригоди"],
              ["🕵️ Детектив", "загадка"],
              ["🌿 Щось затишне", "затишок"],
              ["😱 Трилер", "напруга"],
              ["🎲 На твій вибір", "будь-який жанр"],
            ]);
            return;
          }
        }

        if (tag) ctx.tag = tag;
        if (/будь-який жанр|на твій вибір/.test(t)) ctx.tag = null;

        if (!ctx.kind) {
          message("agent", "Спочатку оберімо, що хочеться знайти 😊");
          buttons([
            ["🎬 Фільм", "фільм"],
            ["📺 Серіал", "серіал"],
            ["🎨 Мультфільм", "мультфільм"],
            ["🇯🇵 Аніме", "аніме"],
            ["📚 Книжка", "книжка"],
            ["🎲 Будь-що", "будь-що"],
          ]);
          return;
        }

        if (!ctx.tag && !/будь-який жанр/.test(t)) {
          message("agent", "Який настрій або жанр тобі підходить?");
          buttons([
            ["😂 Веселе", "сміх"],
            ["❤️ Романтичне", "романтика"],
            ["⚔️ Пригоди", "пригоди"],
            ["🕵️ Загадки", "загадка"],
            ["🌿 Спокійне", "затишок"],
            ["😱 Напружене", "напруга"],
          ]);
          return;
        }

        recommend();
      }

      function send(text) {
        if (!text) return;
        message("user", text);
        input.value = "";
        respond(text);
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        send(input.value.trim());
      });

      start();
    </script>
  </body>
</html>
