<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рекомендатор фільмів і книжок</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #1c2033;
        --muted: #6a7190;
        --border: #e2e5f0;
        --accent: #4f46e5;
        --accent-text: #ffffff;
        --user-bg: #4f46e5;
        --user-text: #ffffff;
        --film: #0f766e;
        --film-soft: #d9f3ef;
        --book: #b45309;
        --book-soft: #fdecd3;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1120;
          --surface: #181b30;
          --text: #eceefa;
          --muted: #9aa1c2;
          --border: #2a2f4d;
          --accent: #8b85ff;
          --accent-text: #11122a;
          --user-bg: #8b85ff;
          --user-text: #11122a;
          --film: #5eead4;
          --film-soft: #12352f;
          --book: #fbbf62;
          --book-soft: #3b2a10;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font-weight: 700;
        text-align: center;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
      }
      .col {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 88%;
        padding: 10px 14px;
        border-radius: 16px;
        word-wrap: break-word;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user-bg);
        color: var(--user-text);
        border-bottom-right-radius: 4px;
      }
      .msg p {
        margin: 0;
      }
      .msg .hint {
        color: var(--muted);
        font-size: 14px;
        margin-top: 10px;
      }
      .card {
        margin-top: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        padding: 1px 9px;
        border-radius: 999px;
        margin-bottom: 4px;
      }
      .badge.film {
        background: var(--film-soft);
        color: var(--film);
      }
      .badge.book {
        background: var(--book-soft);
        color: var(--book);
      }
      .card h3 {
        margin: 0 0 2px;
        font-size: 17px;
      }
      .card .genre {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 6px;
      }
      .card .plot {
        margin: 0;
        font-size: 15px;
      }
      .typing {
        color: var(--muted);
        letter-spacing: 2px;
      }
      form {
        border-top: 1px solid var(--border);
        background: var(--surface);
        padding: 12px 16px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }
      .row {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>🎬 Рекомендатор фільмів і книжок</header>
    <div id="chat"><div class="col" id="col"></div></div>
    <form id="form" autocomplete="off">
      <div class="row">
        <input
          id="input"
          type="text"
          placeholder="Напишіть, який у вас настрій…"
          aria-label="Повідомлення"
          autofocus
        />
        <button type="submit">Надіслати</button>
      </div>
    </form>

    <script>
      var CATALOG = [
        {
          kind: "фільм",
          title: "Форрест Гамп (1994)",
          genre: "драма, комедія",
          moods: ["сумний", "втомлений", "нудьгую"],
          plot: "Добрий чоловік із невисоким IQ випадково стає учасником ключових подій історії США й усе життя кохає подругу дитинства Дженні.",
        },
        {
          kind: "фільм",
          title: "Амелі (2001)",
          genre: "романтична комедія",
          moods: ["радісний", "романтичний", "нудьгую"],
          plot: "Мрійлива парижанка Амелі таємно допомагає людям навколо бути щасливішими, а тим часом сама шукає кохання.",
        },
        {
          kind: "фільм",
          title: "Паразити (2019)",
          genre: "трилер, чорна комедія",
          moods: ["нудьгую", "енергійний"],
          plot: "Бідна родина поступово влаштовується на роботу в дім багатих господарів, але стосунки двох світів виходять з-під контролю.",
        },
        {
          kind: "фільм",
          title: "Мій сусід Тоторо (1988)",
          genre: "анімація, сімейне фентезі",
          moods: ["втомлений", "стресовий", "сумний"],
          plot: "Дві сестри переїжджають у сільський будинок і знайомляться з добрими лісовими духами.",
        },
        {
          kind: "фільм",
          title: "Інтерстеллар (2014)",
          genre: "наукова фантастика",
          moods: ["енергійний", "нудьгую"],
          plot: "Астронавти вирушають крізь червоточину шукати нову домівку для людства, поки Земля занепадає.",
        },
        {
          kind: "фільм",
          title: "Перед сходом сонця (1995)",
          genre: "романтична драма",
          moods: ["романтичний", "стресовий"],
          plot: "Американець і француженка знайомляться в поїзді та проводять ніч, гуляючи Віднем і розмовляючи про життя.",
        },
        {
          kind: "книжка",
          title: "«Маленький принц» (А. де Сент-Екзюпері)",
          genre: "філософська казка",
          moods: ["сумний", "втомлений", "стресовий"],
          plot: "Пілот зустрічає в пустелі хлопчика з далекої планети, який розповідає про свої подорожі та дружбу з трояндою.",
        },
        {
          kind: "книжка",
          title: "«Автостопом по Галактиці» (Д. Адамс)",
          genre: "комедійна фантастика",
          moods: ["радісний", "нудьгую", "енергійний"],
          plot: "Артур Дент дивом уникає знищення Землі та мандрує космосом разом із чудернацьким супутником Фордом Префектом.",
        },
        {
          kind: "книжка",
          title: "«Гобіт» (Дж. Р. Р. Толкін)",
          genre: "фентезі",
          moods: ["енергійний", "втомлений", "нудьгую"],
          plot: "Спокійний гобіт Більбо вирушає з гномами у мандрівку, щоб повернути скарб, який охороняє дракон.",
        },
        {
          kind: "книжка",
          title: "«Тіні забутих предків» (М. Коцюбинський)",
          genre: "повість, романтична драма",
          moods: ["романтичний", "сумний"],
          plot: "Кохання Івана і Марічки, дітей ворожих родів, розгортається серед Карпат і має трагічний кінець.",
        },
        {
          kind: "книжка",
          title: "«Пес Баскервілів» (А. Конан Дойл)",
          genre: "детектив",
          moods: ["нудьгую", "енергійний"],
          plot: "Шерлок Холмс і доктор Ватсон розслідують смерть сера Чарльза Баскервіля, пов’язану з легендою про примарного собаку.",
        },
        {
          kind: "книжка",
          title: "«Гаррі Поттер і філософський камінь» (Дж. Роулінг)",
          genre: "фентезі",
          moods: ["радісний", "стресовий", "нудьгую"],
          plot: "Сирота Гаррі дізнається, що він чарівник, і вирушає навчатися до школи Гоґвортс.",
        },
      ];

      // Слова, за якими агент розпізнає настрій
      var MOODS = {
        сумний: {
          stems: [
            "сумн",
            "сумую",
            "печал",
            "самотн",
            "плач",
            "депрес",
            "погано",
            "тужл",
            "нещасл",
          ],
          words: [],
        },
        радісний: {
          stems: [
            "радіс",
            "радий",
            "щасли",
            "весел",
            "чудов",
            "класн",
            "позитив",
            "відмінн",
            "добре",
            "супер",
          ],
          words: ["рада"],
        },
        втомлений: {
          stems: ["втом", "стомл", "сонн", "виснаж", "засина"],
          words: ["спати", "сон"],
        },
        стресовий: {
          stems: [
            "стрес",
            "нервув",
            "нервов",
            "тривог",
            "хвилю",
            "напружен",
            "панік",
            "переживаю",
          ],
          words: [],
        },
        нудьгую: {
          stems: ["нуд", "скуч", "нічим зайнят", "нічого робити"],
          words: [],
        },
        романтичний: {
          stems: ["романт", "закохан", "кохан", "любов", "ніжн", "побачення"],
          words: [],
        },
        енергійний: {
          stems: [
            "енерг",
            "бадьор",
            "активн",
            "драйв",
            "пригод",
            "екшн",
            "повно сил",
            "заряджен",
          ],
          words: [],
        },
      };
      var INTRO = {
        сумний: "Розумію, інколи буває сумно. Ось що можу порадити:",
        радісний: "Чудово, що настрій гарний! Ось що можу порадити:",
        втомлений: "Схоже, ви втомилися. Ось щось спокійне:",
        стресовий: "Тримайтеся! Ось що допоможе розслабитися:",
        нудьгую: "Тоді ось що вас розважить:",
        романтичний: "Романтичний настрій — чудово! Ось що можу порадити:",
        енергійний: "Енергії багато, тож ось щось захопливе:",
      };

      var ctx = { mood: null, kind: null, shown: [] };
      var col = document.getElementById("col");
      var chat = document.getElementById("chat");

      function tokens(text) {
        return text
          .toLowerCase()
          .split(/[^а-яіїєґ'’a-z0-9]+/)
          .filter(Boolean);
      }
      function detectMood(text) {
        var t = text.toLowerCase(),
          tk = tokens(text);
        for (var m in MOODS) {
          var d = MOODS[m];
          if (
            d.stems.some(function (s) {
              return t.indexOf(s) !== -1;
            })
          )
            return m;
          if (
            d.words.some(function (w) {
              return tk.indexOf(w) !== -1;
            })
          )
            return m;
        }
        return null;
      }
      function detectKind(text) {
        var t = text.toLowerCase();
        var film = /фільм|кіно|подивит|дивитис|подивимос|серіал/.test(t);
        var book = /книж|книг|почит|читат|літератур/.test(t);
        if (film && !book) return "фільм";
        if (book && !film) return "книжка";
        return null;
      }
      function isMore(text) {
        return tokens(text).some(function (w) {
          return (
            w === "ще" ||
            w === "далі" ||
            w === "більше" ||
            w.indexOf("інш") === 0 ||
            w.indexOf("варіант") === 0 ||
            w.indexOf("інакш") === 0
          );
        });
      }

      function pick(mood, kind) {
        var pool = CATALOG.filter(function (c) {
          return (
            ctx.shown.indexOf(c.title) === -1 && (!kind || c.kind === kind)
          );
        });
        var ordered = pool
          .filter(function (c) {
            return c.moods.indexOf(mood) !== -1;
          })
          .concat(
            pool.filter(function (c) {
              return c.moods.indexOf(mood) === -1;
            }),
          );
        if (!kind) {
          var f = ordered.filter(function (c) {
            return c.kind === "фільм";
          })[0];
          var b = ordered.filter(function (c) {
            return c.kind === "книжка";
          })[0];
          return [f, b].filter(Boolean);
        }
        return ordered.slice(0, 2);
      }

      function addMsg(role, text, items, hint) {
        var el = document.createElement("div");
        el.className = "msg " + role;
        if (text) {
          var p = document.createElement("p");
          p.textContent = text;
          el.appendChild(p);
        }
        (items || []).forEach(function (c) {
          var card = document.createElement("div");
          card.className = "card";
          var badge = document.createElement("span");
          badge.className = "badge " + (c.kind === "фільм" ? "film" : "book");
          badge.textContent = c.kind;
          var h = document.createElement("h3");
          h.textContent = c.title;
          var g = document.createElement("p");
          g.className = "genre";
          g.textContent = "Жанр: " + c.genre;
          var pl = document.createElement("p");
          pl.className = "plot";
          pl.textContent = c.plot;
          [badge, h, g, pl].forEach(function (n) {
            card.appendChild(n);
          });
          el.appendChild(card);
          ctx.shown.push(c.title);
        });
        if (hint) {
          var hp = document.createElement("p");
          hp.className = "hint";
          hp.textContent = hint;
          el.appendChild(hp);
        }
        col.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function respond(text) {
        var t = text.toLowerCase();

        if (/спочатку|заново|скинути/.test(t)) {
          ctx = { mood: null, kind: null, shown: [] };
          return { text: "Починаємо спочатку. Який у вас настрій?" };
        }

        var mood = detectMood(text),
          kind = detectKind(text),
          more = isMore(text);
        if (mood) ctx.mood = mood;
        if (kind) ctx.kind = kind;

        var kindWord =
          ctx.kind === "фільм"
            ? "фільм"
            : ctx.kind === "книжка"
              ? "книжку"
              : null;

        if (!ctx.mood) {
          if (/дяку|дякс/.test(t))
            return {
              text: "Будь ласка! Якщо захочете ще щось, просто напишіть.",
            };
          if (kind)
            return {
              text: "Гаразд, підберу " + kindWord + ". А який у вас настрій?",
            };
          if (/привіт|вітаю|добрий|здоров|hello|^hi\b/.test(t)) {
            return {
              text: "Привіт! Розкажіть, який у вас настрій, і я підберу фільм або книжку.",
            };
          }
          return {
            text: "Розкажіть, який у вас настрій: сумно, весело, нудно, втомились, хочеться романтики чи пригод?",
          };
        }

        if (!mood && !kind && !more) {
          if (/дяку|дякс/.test(t))
            return {
              text: "Будь ласка! Якщо захочете ще щось, просто напишіть.",
            };
          if (/привіт|вітаю|добрий|здоров|hello|^hi\b/.test(t)) {
            return {
              text: "Привіт! Розкажіть, який у вас настрій, і я підберу фільм або книжку.",
            };
          }
          return {
            text: "Не зовсім зрозумів. Розкажіть про свій настрій або напишіть «ще», щоб отримати інші варіанти.",
          };
        }

        var items = pick(ctx.mood, ctx.kind);
        if (!items.length) {
          return {
            text: "Нових варіантів для цього запиту в мене вже немає. Спробуйте інший настрій або напишіть «спочатку».",
          };
        }
        return {
          text: INTRO[ctx.mood],
          items: items,
          hint: "Напишіть «ще», якщо хочете інші варіанти.",
        };
      }

      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("input");
        var text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMsg("user", text);
        var wait = addMsg("agent", "•••");
        wait.firstChild.className = "typing";
        setTimeout(function () {
          col.removeChild(wait);
          var r = respond(text);
          addMsg("agent", r.text, r.items, r.hint);
        }, 450);
      });

      addMsg(
        "agent",
        "Привіт! Розкажіть, який у вас настрій, і я підберу фільм або книжку.",
      );
    </script>
  </body>
</html>
