    <title>Рекомендатор фільмів і книжок</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #17152d, #30234b);
        color: #fff;
        min-height: 100vh;
      }

      .container {
        max-width: 850px;
        margin: auto;
        background: #211d38;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 10px 35px #0005;
      }

      h1 {
        text-align: center;
        color: #d8b4fe;
      }

      .subtitle {
        text-align: center;
        color: #c8c1dc;
        margin-bottom: 25px;
      }

      #chat {
        min-height: 300px;
        max-height: 480px;
        overflow-y: auto;
        padding: 10px;
        background: #19162b;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      .msg {
        padding: 12px 15px;
        border-radius: 12px;
        margin: 10px 0;
        line-height: 1.5;
        max-width: 90%;
      }

      .agent {
        background: #393052;
        margin-right: auto;
      }

      .user {
        background: #7650a8;
        margin-left: auto;
      }

      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin: 12px 0 18px;
      }

      .choice {
        border: none;
        border-radius: 20px;
        padding: 10px 15px;
        background: #a879d4;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      .choice:hover {
        background: #c09ae8;
        color: #211d38;
      }

      form {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 13px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
      }

      button[type="submit"] {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        background: #a879d4;
        color: white;
        cursor: pointer;
      }

      .card {
        background: #302746;
        border: 1px solid #624b7e;
        border-radius: 12px;
        padding: 15px;
        margin: 12px 0;
      }

      .card h3 {
        color: #e0c1ff;
        margin: 0 0 8px;
      }

      .badge {
        display: inline-block;
        background: #7650a8;
        padding: 4px 9px;
        border-radius: 15px;
        font-size: 12px;
        margin-bottom: 8px;
      }

      .genre {
        color: #d7b8f5;
        font-size: 14px;
        margin-bottom: 8px;
      }

      @media (max-width: 600px) {
        body {
          padding: 10px;
        }

        .container {
          padding: 15px;
        }

        form {
          flex-direction: column;
        }

        button[type="submit"] {
          width: 100%;
        }
      }
    </style>
  </head>

          genre: "Детектив, трилер",
          plot: "Десятеро незнайомців опиняються на острові, де починають відбуватися загадкові смерті.",
          tag: "загадка",
        },
        {
          kind: "книжка",
          title: "Квіти для Елджернона",
          genre: "Наукова фантастика, драма",
          plot: "Чоловік погоджується на експеримент, який може змінити його інтелект.",
          tag: "драма",
        },
        {
          kind: "книжка",
          title: "Персі Джексон і викрадач блискавок",
          genre: "Фентезі, пригоди",
          plot: "Хлопець дізнається, що він син грецького бога, і вирушає на небезпечну місію.",
          tag: "пригоди",
        },
        {
          kind: "книжка",
          title: "Крамниця на розі світу",
          genre: "Сучасна проза",
          plot: "Затишна історія про маленькі радощі, людей і несподівані життєві зміни.",
          tag: "затишок",
        },
        {
          kind: "книжка",
          title: "Вбивство у Східному експресі",
          genre: "Детектив",
          plot: "Еркюль Пуаро розслідує вбивство, яке сталося у потязі серед снігів.",
          tag: "загадка",
        },
        {
          kind: "книжка",
          title: "Місто дівчат",
          genre: "Романтика, драма",
          plot: "Молода дівчина відкриває для себе доросле життя, дружбу та кохання.",
          tag: "романтика",
        },
      ];

      const chat = document.getElementById("chat");
      const col = document.getElementById("col");
      const input = document.getElementById("input");
      const form = document.getElementById("form");

      let ctx = {
        mood: null,
        kind: null,
        genre: null,
        shown: [],
      };

      function message(text, who = "agent") {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function buttons(items) {
        col.innerHTML = "";

        items.forEach((item) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.textContent = item.label;
          btn.addEventListener("click", () => {
            col.innerHTML = "";
            message(item.label, "user");
            respond(item.value);
          });
          col.appendChild(btn);
        });
      }

      function start() {
        message(
          "Привіт! 😊 Я допоможу тобі обрати фільм, мультфільм, аніме, серіал або книжку.",
        );
        message("Спочатку хочу дізнатися: який у тебе зараз настрій?");
        startMoodButtons();
      }

      function startMoodButtons() {
        buttons([
          { label: "😄 Веселий", value: "настрій веселий" },
          { label: "😢 Сумний", value: "настрій сумний" },
          { label: "😴 Втомлений", value: "настрій втомлений" },
          { label: "❤️ Романтичний", value: "настрій романтичний" },
          { label: "😰 Тривожний", value: "настрій тривожний" },
          { label: "🥱 Нудьгую", value: "настрій нудьгую" },
          { label: "⚡ Бадьорий", value: "настрій бадьорий" },
          { label: "😌 Спокійний", value: "настрій спокійний" },
        ]);
      }

      function detectMood(text) {
        const t = text.toLowerCase();

        if (/весел|радіс|щаслив|гарний настрій/.test(t)) return "веселий";
        if (/сум|сумн|плакс|поганий настрій/.test(t)) return "сумний";
        if (/втом|виснаж|сонн|хочу відпочити/.test(t)) return "втомлений";
        if (/тривож|стрес|нерв|пережива/.test(t)) return "тривожний";
        if (/нудьг|скуч|не знаю що робити/.test(t)) return "нудьгую";
        if (/бадьор|енергі|актив|сповнений сил/.test(t)) return "бадьорий";
        if (/спокійн|розслаб|умиротвор/.test(t)) return "спокійний";

        return null;
      }

      function detectKind(text) {
        const t = text.toLowerCase();

        if (/мультфільм|мультик|мульт/.test(t)) return "мультфільм";
        if (/аніме/.test(t)) return "аніме";
        if (/серіал|серії/.test(t)) return "серіал";
        if (/книж|книг|роман почит|читати/.test(t)) return "книжка";
        if (/фільм|кіно/.test(t)) return "фільм";
        if (/будь-як|усе|все одно|неважливо|будь-що/.test(t)) return "усе";

        return null;
      }

      function detectGenre(text) {
        const t = text.toLowerCase();

        if (/комед|сміш|гумор/.test(t)) return "комедія";
        if (/романтик|кохан|любов|мелодрам/.test(t)) return "романтика";
        if (/детектив|розслідуван|загадк/.test(t)) return "детектив";
        if (/трилер|жах|страш/.test(t)) return "трилер";
        if (/фантаст|космос|науков/.test(t)) return "фантастика";
        if (/пригод/.test(t)) return "пригоди";
        if (/драм/.test(t)) return "драма";
        if (/фентезі|магі|чарів/.test(t)) return "фентезі";

        return null;
      }

      function moodMatches(item) {
        const map = {
          веселий: ["сміх", "пригоди"],
          сумний: ["затишок", "романтика", "драма"],
          втомлений: ["затишок", "сміх"],
          романтичний: ["романтика"],
          тривожний: ["затишок", "сміх"],
          нудьгую: ["пригоди", "загадка", "сміх"],
          бадьорий: ["пригоди", "напруга"],
          спокійний: ["затишок", "драма"],
        };

        return map[ctx.mood]?.includes(item.tag) || false;
      }

      function recommend() {
        let results = CATALOG.filter((item) => {
          const kindMatch = ctx.kind === "усе" || item.kind === ctx.kind;
          const genreMatch =
            !ctx.genre || item.genre.toLowerCase().includes(ctx.genre);
          return kindMatch && genreMatch;
        });

        results.sort((a, b) => {
          const moodA = moodMatches(a) ? 1 : 0;
          const moodB = moodMatches(b) ? 1 : 0;
          return moodB - moodA;
        });

        const fresh = results.filter((item) => !ctx.shown.includes(item.title));
        const selected = fresh.slice(0, 4);

        if (selected.length === 0) {
          message(
            "Я вже показав усі відповідні варіанти. Можемо почати спочатку або змінити жанр.",
          );
          buttons([
            { label: "🔄 Почати спочатку", value: "почати спочатку" },
            { label: "🎭 Інший жанр", value: "інший жанр" },
          ]);
          return;
        }

        message("Ось що я підібрав для тебе! ✨");

        selected.forEach((item) => {
          ctx.shown.push(item.title);

          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = item.title;

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = item.kind;

          const genre = document.createElement("div");
          genre.className = "genre";
          genre.textContent = "Жанр: " + item.genre;

          const plot = document.createElement("p");
          plot.textContent = "Сюжет: " + item.plot;

          card.append(title, badge, genre, plot);
          chat.appendChild(card);
        });

        chat.scrollTop = chat.scrollHeight;

        message("Сподіваюся, тобі щось сподобалося! Хочеш ще рекомендації?");
        buttons([
          { label: "Ще варіанти", value: "ще" },
          { label: "Інший жанр", value: "інший жанр" },
          { label: "Змінити тип", value: "змінити тип" },
          { label: "Почати спочатку", value: "почати спочатку" },
        ]);
      }

      function askKind() {
        message("Що саме хочеш подивитися або почитати?");
        buttons([
          { label: "🎬 Фільм", value: "фільм" },
          { label: "🐻 Мультфільм", value: "мультфільм" },
          { label: "🌸 Аніме", value: "аніме" },
          { label: "📺 Серіал", value: "серіал" },
          { label: "📚 Книжка", value: "книжка" },
          { label: "🎲 Будь-що", value: "усе" },
        ]);
      }

      function askGenre() {
        message(
          "Чудово! А який жанр тобі подобається? Можеш також пропустити цей крок.",
        );
        buttons([
          { label: "😂 Комедія", value: "комедія" },
          { label: "❤️ Романтика", value: "романтика" },
          { label: "🔎 Детектив", value: "детектив" },
          { label: "😱 Трилер", value: "трилер" },
          { label: "🚀 Фантастика", value: "фантастика" },
          { label: "🗺️ Пригоди", value: "пригоди" },
          { label: "🎭 Драма", value: "драма" },
          { label: "🪄 Фентезі", value: "фентезі" },
          { label: "Неважливо", value: "будь-який жанр" },
        ]);
      }

      function respond(text) {
        const t = text.toLowerCase().trim();

        if (t === "почати спочатку") {
          ctx = { mood: null, kind: null, genre: null, shown: [] };
          chat.innerHTML = "";
          start();
          return;
        }

        if (t === "ще") {
          recommend();
          return;
        }

        if (t === "інший жанр") {
          ctx.genre = null;
          askGenre();
          return;
        }

        if (t === "змінити тип") {
          ctx.kind = null;
          ctx.genre = null;
          askKind();
          return;
        }

        // 1. НАСТРІЙ — ГОЛОВНИЙ ПРІОРИТЕТ
        if (!ctx.mood) {
          const mood = detectMood(t);

          if (mood) {
            ctx.mood = mood;
            message("Зрозумів! Твій настрій: " + mood + " 😊");
            askKind();
            return;
          }

          message("Спочатку обери або напиши свій настрій.");
          startMoodButtons();
          return;
        }

        // 2. ТИП КОНТЕНТУ
        if (!ctx.kind) {
          const kind = detectKind(t);

          if (kind) {
            ctx.kind = kind;
            askGenre();
            return;
          }

          message(
            "Будь ласка, обери тип контенту: фільм, мультфільм, аніме, серіал або книжка.",
          );
          askKind();
          return;
        }

        // 3. ЖАНР
        if (!ctx.genre) {
          if (/будь-який жанр|неважливо|пропустити/.test(t)) {
            ctx.genre = null;
            recommend();
            return;
          }

          const genre = detectGenre(t);

          if (genre) {
            ctx.genre = genre;
            recommend();
            return;
          }

          message("Обери жанр зі списку або натисни «Неважливо».");
          askGenre();
          return;
        }

        recommend();
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const text = input.value.trim();
        if (!text) return;

        message(text, "user");
        input.value = "";
        respond(text);
      });

      start();
    </script>
  </body>
</html>
